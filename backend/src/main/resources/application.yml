spring:
  application:
    name: ground-control

  datasource:
    url: ${GC_DATABASE_URL:jdbc:postgresql://localhost:5432/ground_control}
    username: ${GC_DATABASE_USER:gc}
    password: ${GC_DATABASE_PASSWORD:gc}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      org.hibernate.envers:
        audit_table_suffix: _audit

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: ${GC_CACHE_TYPE:none}

  data:
    redis:
      url: ${GC_REDIS_URL:redis://localhost:6379}

server:
  port: ${GC_SERVER_PORT:8000}
  servlet:
    context-path: /
    # ADR-037 §6: browser session cookie hardening. The name is renamed so a deployment can
    # distinguish Ground Control's session from co-tenants on the same host without sniffing
    # cookie contents; Secure / HttpOnly / SameSite are hardcoded to the production-safe
    # settings. Dev and test profiles relax `secure` so HTTP MockMvc / localhost can read the
    # cookie. There are no operator-facing knobs for these values — changing them needs an
    # ADR and a security review, not a deploy-time env var.
    session:
      timeout: 60m
      cookie:
        name: GC_SESSION
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

groundcontrol:
  security:
    enabled: ${GC_SECURITY_ENABLED:true}
    openapi-public: ${GC_SECURITY_OPENAPI_PUBLIC:false}
    credentials: []
    ip-allowlist: []
  github:
    gh-path: ${GC_GH_PATH:}
  age:
    enabled: ${GC_AGE_ENABLED:false}
    graph-name: ${GC_AGE_GRAPH_NAME:requirements}
  sweep:
    enabled: ${GC_SWEEP_ENABLED:false}
    cron: ${GC_SWEEP_CRON:0 0 6 * * *}
    github:
      enabled: ${GC_SWEEP_GITHUB_ENABLED:false}
      repo: ${GC_SWEEP_GITHUB_REPO:}
      labels: ${GC_SWEEP_GITHUB_LABELS:analysis-sweep}
    webhook:
      enabled: ${GC_SWEEP_WEBHOOK_ENABLED:false}
      url: ${GC_SWEEP_WEBHOOK_URL:}
  compliance:
    audit-retention-days: ${GC_AUDIT_RETENTION_DAYS:-1}
    audit-retention-cron: ${GC_AUDIT_RETENTION_CRON:0 0 3 * * *}
  embedding:
    provider: ${GC_EMBEDDING_PROVIDER:none}
    api-key: ${GC_EMBEDDING_API_KEY:}
    api-url: ${GC_EMBEDDING_API_URL:https://api.openai.com/v1}
    model: ${GC_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${GC_EMBEDDING_DIMENSIONS:1536}
    batch-size: ${GC_EMBEDDING_BATCH_SIZE:100}
    similarity-threshold: ${GC_EMBEDDING_SIMILARITY_THRESHOLD:0.85}
  temporal:
    worker:
      enabled: ${GROUNDCONTROL_TEMPORAL_WORKER_ENABLED:false}
      target: ${GROUNDCONTROL_TEMPORAL_WORKER_TARGET:localhost:7233}
      namespace: ${GROUNDCONTROL_TEMPORAL_WORKER_NAMESPACE:ground-control}
      task-queue: ${GROUNDCONTROL_TEMPORAL_WORKER_TASK_QUEUE:ground-control-implement}
    # GC-O009 #1278 workflow control surface (REST + MCP start/status/signal). Reuses the worker's
    # WorkflowClient as the Temporal connection, so enabling control also requires worker.enabled=true.
    control:
      enabled: ${GROUNDCONTROL_TEMPORAL_CONTROL_ENABLED:false}
      # Unset by default so the control surface shares the worker's task queue; override only to
      # deliberately start executions on a different queue.
      task-queue: ${GROUNDCONTROL_TEMPORAL_CONTROL_TASK_QUEUE:}
      default-completion-command: ${GROUNDCONTROL_TEMPORAL_CONTROL_DEFAULT_COMPLETION_COMMAND:make check}
  derivation:
    boundary:
      # Canonical boundary-model derivation input adapter (GC-GRC-004).
      # Emits derived architectural boundary inputs from repo-local paths; declared boundaries
      # are supplied through the validated .ground-control.yaml MCP context.
      enabled: true
      # repository-root defaults to Path.of(".") like the other derivation adapters.
      # Override with GROUNDCONTROL_DERIVATION_BOUNDARY_REPOSITORY_ROOT when needed.
      ruleset-version: "1.0.0"
    iac:
      # IaC and CI/CD pipeline derivation adapter (GC-GRC-003).
      # enabled: toggle the adapter on/off without removing configuration.
      enabled: true
      # repository-root defaults to the working directory (Path.of(".")) via the
      # @ConfigurationProperties field default; it is intentionally NOT set here because Spring's
      # web-aware PathEditor cannot convert a bare "." to a Path in a ServletContext. Override with
      # a file:-prefixed path via GROUNDCONTROL_DERIVATION_IAC_REPOSITORY_ROOT if a non-default root
      # is required.
      # max-file-bytes: per-file byte limit; files exceeding this emit a TOOL_EXECUTION_FAILED
      # capture limit instead of being parsed (default 512 KB).
      max-file-bytes: 524288
      # max-files: total file scan cap per derivation run (default 1000).
      max-files: 1000
      # excluded-paths: directory names whose subtrees are never scanned.
      excluded-paths:
        - .git
        - .gc
        - .claude/worktrees
        - node_modules
        - dist
        - target
        - build
      # enabled-surfaces: subset of supported surfaces to activate.
      enabled-surfaces:
        - github-actions
        - dockerfile
        - docker-compose
        - terraform
      # ruleset-version: version label embedded in fact provenance for traceability.
      ruleset-version: "1.0.0"

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs
