spring:
  application:
    name: ground-control

  datasource:
    url: ${GC_DATABASE_URL:jdbc:postgresql://localhost:5432/ground_control}
    username: ${GC_DATABASE_USER:gc}
    password: ${GC_DATABASE_PASSWORD:gc}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      org.hibernate.envers:
        audit_table_suffix: _audit

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: ${GC_CACHE_TYPE:none}

  data:
    redis:
      url: ${GC_REDIS_URL:redis://localhost:6379}

server:
  port: ${GC_SERVER_PORT:8000}
  servlet:
    context-path: /
    # ADR-037 §6: browser session cookie hardening. The name is renamed so a deployment can
    # distinguish Ground Control's session from co-tenants on the same host without sniffing
    # cookie contents; Secure / HttpOnly / SameSite are hardcoded to the production-safe
    # settings. Dev and test profiles relax `secure` so HTTP MockMvc / localhost can read the
    # cookie. There are no operator-facing knobs for these values — changing them needs an
    # ADR and a security review, not a deploy-time env var.
    session:
      timeout: 60m
      cookie:
        name: GC_SESSION
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

# Product version surface. `@projectVersion@` is replaced at build time by
# processResources (build.gradle.kts) with the Release Please-managed version so
# logback (info.app.version -> SERVICE_VERSION) and /actuator/info report the shipped
# product version instead of the "unknown" fallback (GC-P027 / #1399).
info:
  app:
    name: ground-control
    version: "@projectVersion@"

groundcontrol:
  security:
    enabled: ${GC_SECURITY_ENABLED:true}
    openapi-public: ${GC_SECURITY_OPENAPI_PUBLIC:false}
    credentials: []
    ip-allowlist: []
  workflow-telemetry:
    # Bounds for the live workflow-run SSE stream (issue #1436, ADR-061 #1436 amendment).
    # Non-secret operational tuning. heartbeat-interval must stay below idle-timeout and below any
    # reverse-proxy read timeout, and max-connections-per-principal must not exceed max-connections;
    # both relations are validated at startup.
    stream:
      enabled: ${GC_STREAM_ENABLED:true}
      max-connections: ${GC_STREAM_MAX_CONNECTIONS:64}
      max-connections-per-principal: ${GC_STREAM_MAX_CONNECTIONS_PER_PRINCIPAL:8}
      queue-capacity: ${GC_STREAM_QUEUE_CAPACITY:64}
      heartbeat-interval: ${GC_STREAM_HEARTBEAT_INTERVAL:15s}
      idle-timeout: ${GC_STREAM_IDLE_TIMEOUT:15m}
  github:
    gh-path: ${GC_GH_PATH:}
  age:
    enabled: ${GC_AGE_ENABLED:false}
    graph-name: ${GC_AGE_GRAPH_NAME:requirements}
  sweep:
    enabled: ${GC_SWEEP_ENABLED:false}
    cron: ${GC_SWEEP_CRON:0 0 6 * * *}
    github:
      enabled: ${GC_SWEEP_GITHUB_ENABLED:false}
      repo: ${GC_SWEEP_GITHUB_REPO:}
      labels: ${GC_SWEEP_GITHUB_LABELS:analysis-sweep}
    webhook:
      enabled: ${GC_SWEEP_WEBHOOK_ENABLED:false}
      url: ${GC_SWEEP_WEBHOOK_URL:}
  compliance:
    audit-retention-days: ${GC_AUDIT_RETENTION_DAYS:-1}
    audit-retention-cron: ${GC_AUDIT_RETENTION_CRON:0 0 3 * * *}
  embedding:
    provider: ${GC_EMBEDDING_PROVIDER:none}
    api-key: ${GC_EMBEDDING_API_KEY:}
    api-url: ${GC_EMBEDDING_API_URL:https://api.openai.com/v1}
    model: ${GC_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${GC_EMBEDDING_DIMENSIONS:1536}
    batch-size: ${GC_EMBEDDING_BATCH_SIZE:100}
    similarity-threshold: ${GC_EMBEDDING_SIMILARITY_THRESHOLD:0.85}
springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs
