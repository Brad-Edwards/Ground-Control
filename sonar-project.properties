sonar.projectKey=autarchy-ai_Ground-Control
sonar.organization=autarchy-ai

# Ground Control is an MCP server (Node.js) over repo-local files plus Python
# repo tooling (issue #1500): analyze the MCP server, the policy/tooling Python,
# and the bin scripts. Tests are carved out of sources by test.inclusions.
sonar.sources=mcp/ground-control,tools,bin
sonar.tests=mcp/ground-control,tools/tests
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,tools/tests/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.min.js

sonar.python.version=3.12
