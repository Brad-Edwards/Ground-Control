fail_fast: true

repos:
  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Bash syntax check for the repo's shell entry points.
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n (shell scripts)
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        files: ^(scripts/.*\.sh|bin/install-skills\.sh|tools/.*\.sh)$

  # =============================================================================
  # STAGE 2: Security
  # =============================================================================

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # =============================================================================
  # STAGE 3: Push-time checks
  # =============================================================================
  #
  # Broad verification (`make mcp-test`, `bin/policy`, Vale) is deliberately
  # absent here. Each already runs twice per change: once at the /implement
  # completion and policy gates (Step 6, then again on the post-base-sync tree
  # at Step 8.5) and once in the CI `policy` job. Re-running them at commit time
  # made every commit pay for verification the workflow had just performed on
  # the same tree, and the commit-time copy is the weakest of the three: it is
  # skippable with `--no-verify`, it is path-filtered so it degrades silently on
  # diffs outside its patterns, and it leaves no record any gate can attest to.
  # Commit time keeps only what nothing else does: file hygiene and secret
  # scanning.
  #
  # `make mcp-test` and `make policy` remain the local way to run the broad
  # gates on demand; nothing about their coverage changed.

  - repo: local
    hooks:
      - id: pr-body-policy
        name: pr body template (only on push, when a PR exists)
        entry: scripts/check-pr-body.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
