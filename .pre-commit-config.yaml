fail_fast: true

repos:
  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^backend/src/test/

  # Bash syntax check for deploy/operator scripts
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n (deploy + ops scripts)
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        files: ^(deploy/scripts/.*\.sh|scripts/(assert-backup-policy|deploy)\.sh)$

      - id: assert-backup-policy
        name: assert GC-P021 backup policy defaults
        entry: scripts/assert-backup-policy.sh
        language: system
        files: ^(deploy/scripts/(backup|install-gc-backup|aurora-setup-gc-backup)\.sh|deploy/systemd/gc-backup\.(service|timer)|scripts/assert-backup-policy\.sh)$
        pass_filenames: false

  # Java formatting (Spotless via Gradle — auto-fix mode)
  - repo: local
    hooks:
      - id: spotless
        name: spotless (Java auto-format)
        entry: bash -c 'cd backend && ./gradlew spotlessApply -q'
        language: system
        files: ^backend/.*\.java$
        pass_filenames: false

  # =============================================================================
  # STAGE 2: Security
  # =============================================================================

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # =============================================================================
  # STAGE 3: Full verification (CI-equivalent)
  # =============================================================================

  - repo: local
    hooks:
      - id: repo-policy
        name: repo policy guardrails
        entry: python3 bin/policy --skip-pr-body --staged
        language: system
        files: ^(AGENTS\.md|\.claude/|\.github/|architecture/|backend/|docs/|mcp/|specs/|tools/)
        pass_filenames: false

      - id: vale-prose-lint
        name: Vale prose lint (ADR-054)
        entry: tools/vale-lint-hook.sh
        language: system
        types_or: [markdown]
        exclude: ^(CHANGELOG\.md|node_modules/|\.tools/|\.vale/)

      - id: pr-body-policy
        name: pr body template (only on push, when a PR exists)
        entry: scripts/check-pr-body.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: gradle-check
        name: gradle check (build + test + static analysis + coverage)
        entry: bash -c 'cd backend && ./gradlew check -q'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: openjml-esc
        name: openjml ESC (formal verification of JML contracts)
        entry: bash -c 'cd backend && ./gradlew openjmlEsc -q'
        language: system
        files: ^backend/src/main/java/com/keplerops/groundcontrol/domain/(requirements|adrs)/state/
        pass_filenames: false
