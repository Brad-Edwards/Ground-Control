fail_fast: true

repos:
  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^contracts/openapi/openapi\.json$
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^backend/src/test/

  # Bash syntax check for deploy/operator scripts
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n (deploy + ops scripts)
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        files: ^(deploy/scripts/.*\.sh|scripts/(assert-backup-policy|deploy|install-hooks)\.sh)$

      - id: assert-backup-policy
        name: assert GC-P021 backup policy defaults
        entry: scripts/assert-backup-policy.sh
        language: system
        files: ^(deploy/scripts/(backup|install-gc-backup|aurora-setup-gc-backup)\.sh|deploy/systemd/gc-backup\.(service|timer)|scripts/assert-backup-policy\.sh)$
        pass_filenames: false

  # Java formatting (Spotless via Gradle — auto-fix mode)
  - repo: local
    hooks:
      - id: spotless
        name: spotless (Java auto-format)
        entry: bash -c 'cd backend && ./gradlew spotlessApply -q'
        language: system
        files: ^backend/.*\.java$
        pass_filenames: false

  # =============================================================================
  # STAGE 2: Security
  # =============================================================================

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # =============================================================================
  # STAGE 3: Push-time checks
  # =============================================================================
  #
  # Broad verification (`./gradlew check`, `bin/policy`, Vale, OpenJML ESC) is
  # deliberately absent here. Each of those already runs twice per change: once
  # at the /implement completion + policy gates (Step 6, then again on the
  # post-base-sync tree at Step 8.5) and once in the CI `policy` / `test` /
  # `openjml` jobs. Re-running them at commit time made every commit pay for
  # verification the workflow had just performed on the same tree, and the
  # commit-time copy is the weakest of the three: it is skippable with
  # `--no-verify`, it is path-filtered so it silently degrades on diffs outside
  # `^backend/`, and it leaves no record any gate can attest to. Commit time
  # keeps only what nothing else does: file hygiene, secret scanning, and
  # auto-formatting.
  #
  # `make check` / `make policy` remain the local way to run the broad gates on
  # demand; nothing about their coverage changed.

  - repo: local
    hooks:
      - id: pr-body-policy
        name: pr body template (only on push, when a PR exists)
        entry: scripts/check-pr-body.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
