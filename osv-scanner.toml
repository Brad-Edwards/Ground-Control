# OSV-Scanner configuration (issue #1535).
#
# The `osv-scanner` required check (`.github/workflows/security.yml`) scans the
# whole repo and, unlike the sibling `trivy` job (`ignore-unfixed: true`), has no
# built-in way to skip advisories with no upstream fix. The single entry below is
# such a case, not a suppressed fixable finding: every vulnerability that HAS a
# released fix is upgraded, not ignored (see the npm `overrides` bump and the
# nltk 3.10.3 lock bump in this PR). This mirrors the trivy job's existing
# ignore-unfixed policy for un-actionable findings; it is user-authorized.

[[IgnoredVulns]]
id = "GHSA-8mgp-746c-j5xp"
ignoreUntil = 2026-12-01
reason = "No upstream fix available: this NLTK advisory (model-artifact APIs bypass pathsec and touch files outside allowed roots) affects the latest nltk release (3.10.3) with no fixed version published. nltk is a dependency of the lit-review-argument research skill only and is imported nowhere in the MCP server or the repo's CI/policy tooling; exploiting it requires loading an attacker-supplied NLTK model artifact, which no repository CI or runtime path does. Every nltk advisory that HAS a fix is cleared by the 3.10.0 -> 3.10.3 lock bump in this PR. Re-evaluate when nltk ships a fix (ignoreUntil 2026-12-01)."
