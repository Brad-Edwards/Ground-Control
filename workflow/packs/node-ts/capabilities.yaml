schema_version: 1
pack: node-ts
version: 1.0.0
bindings:
  format:
    status: provided
    provider: biome-prettier-script
    command: "npm run format:check --if-present || npm run format --if-present"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - package.json
        - biome.json
        - ".prettierrc*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  lint:
    status: provided
    provider: biome-eslint
    command: "npm run lint"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - package.json
        - biome.json
        - "eslint.config.*"
    thresholds:
      platform_minimum:
        metric: lint_errors
        max: 0
      recommendation:
        metric: lint_errors
        max: 0
  build:
    status: provided
    provider: package-build
    command: "npm run build --if-present"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - package.json
        - "tsconfig*.json"
        - "vite.config.*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1200
  type_safety:
    status: provided
    provider: typescript
    command: "npm run typecheck --if-present || npx tsc --noEmit"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "tsconfig*.json"
        - package.json
    thresholds:
      platform_minimum:
        metric: type_errors
        max: 0
      recommendation:
        metric: type_errors
        max: 0
  unit_tests:
    status: provided
    provider: node-test-runner
    command: "npm test"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - "test/**"
        - "tests/**"
        - package.json
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1200
  integration_tests:
    status: provided
    provider: playwright-or-script
    command: "npm run test:integration --if-present || npm run test:e2e --if-present"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - "tests/**"
        - "playwright.config.*"
        - package.json
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1800
  contract_boundary:
    status: provider_missing
    provider_missing: reviewer_fallback
    blocking: false
    reason: "TypeScript boundary contracts depend on project-selected Zod, Valibot, assertion, or generated-contract conventions."
    thresholds:
      platform_minimum:
        metric: provider_declared
        policy: reviewer_fallback
      recommendation:
        metric: provider_declared
        policy: deterministic_provider_when_adopted
  property_verification:
    status: provided
    provider: fast-check
    command: "npm run test:property --if-present"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - "test/**"
        - "tests/**"
        - package.json
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  architecture:
    status: provided
    provider: dependency-cruiser
    command: "npx dependency-cruiser --config .gc/gate-packs/node-ts/dependency-cruiser.cjs src"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - package.json
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  complexity:
    status: provided
    provider: biome-eslint-complexity
    command: "npm run lint"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - package.json
    thresholds:
      platform_minimum:
        metric: cyclomatic_complexity
        max: 15
      recommendation:
        metric: cyclomatic_complexity
        max: 10
  mutation:
    status: provided
    provider: stryker-js
    command: "npx stryker run"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - "test/**"
        - "tests/**"
        - package.json
    thresholds:
      platform_minimum:
        metric: mutation_score
        min: 50
      recommendation:
        metric: mutation_score
        min: 80
    timeout_seconds: 3600
  diff_coverage:
    status: provided
    provider: vitest-diff-cover
    command: "npm run coverage --if-present && diff-cover coverage/lcov.info --fail-under=90"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "src/**"
        - "test/**"
        - "tests/**"
    thresholds:
      platform_minimum:
        metric: changed_line_coverage
        min: 80
      recommendation:
        metric: changed_line_coverage
        min: 90
  sast:
    status: provided
    provider: semgrep-ts-js
    command: "semgrep --config p/typescript --config p/javascript --error"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - package.json
    thresholds:
      platform_minimum:
        metric: sast_severity
        severity: high
      recommendation:
        metric: sast_severity
        severity: medium
  secret_scan:
    status: provided
    provider: gitleaks
    command: "gitleaks detect --source . --no-git --redact --exit-code 1"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  dependency_policy:
    status: provided
    provider: npm-audit-osv
    command: "npm audit --audit-level=high"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - package.json
        - package-lock.json
        - pnpm-lock.yaml
        - yarn.lock
    thresholds:
      platform_minimum:
        metric: vulnerability_severity
        severity: high
      recommendation:
        metric: vulnerability_severity
        severity: medium
  accessibility:
    status: provided
    provider: jsx-a11y-playwright-axe
    command: "npm run test:a11y --if-present"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "src/**/*.tsx"
        - "src/**/*.jsx"
        - "playwright.config.*"
        - package.json
    thresholds:
      platform_minimum:
        metric: wcag_violations
        max: 0
      recommendation:
        metric: wcag_2_1_aa_violations
        max: 0
  docs_policy:
    status: provided
    provider: docs-profile
    command: "if command -v vale >/dev/null 2>&1; then vale .; else echo 'vale not installed; docs policy provider unavailable'; exit 1; fi"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "*.md"
        - "**/*.md"
        - "*.markdown"
        - "**/*.markdown"
        - "docs/**"
        - "architecture/adrs/**"
        - .ground-control.yaml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  traceability:
    status: provider_missing
    provider_missing: reviewer_fallback
    blocking: false
    reason: "Ground Control traceability requires a configured project and live server context."
    thresholds:
      platform_minimum:
        metric: provider_declared
        policy: reviewer_fallback
      recommendation:
        metric: provider_declared
        policy: deterministic_provider_when_adopted
  policy:
    status: provided
    provider: repo-policy
    command: "npm run policy --if-present || (if [ -f Makefile ] && grep -q '^policy:' Makefile; then make policy; else echo 'No repo policy command found'; exit 1; fi)"
    blocking: true
    scope: repo
    applies_when:
      paths:
        - "**/*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1800
  remote_status:
    status: provided
    provider: required-statuses
    blocking: true
    scope: repo
    required_statuses:
      - ci
    thresholds:
      platform_minimum:
        metric: required_statuses
        policy: all_success
      recommendation:
        metric: required_statuses
        policy: all_success
