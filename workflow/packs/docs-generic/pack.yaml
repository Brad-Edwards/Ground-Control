schema_version: 1
id: docs-generic
version: 1.0.0
name: "Generic documentation gate pack"
description: "Documentation, policy, and code-light repository gates grounded in aiops and keplerops-platform pre-commit workflows."
compatible_engine: ">=1.0.0 <2.0.0"
profiles:
  - id: default
    description: "Markdown, policy, and code-light repository."
  - id: docs
    description: "Documentation-focused repository."
grounded_local_anchors:
  - "aiops and keplerops-platform: pre-commit run --all-files as test/lint/completion"
  - "Code-light repositories in the scan must not receive build or mutation gates"
capabilities_provided:
  - format
  - lint
  - sast
  - secret_scan
  - dependency_policy
  - docs_policy
  - policy
  - remote_status
capabilities_not_provided:
  provider_missing:
    - traceability
  not_applicable:
    - build
    - type_safety
    - unit_tests
    - integration_tests
    - contract_boundary
    - property_verification
    - architecture
    - complexity
    - mutation
    - diff_coverage
    - accessibility
threshold_tiers:
  platform_minimums: "encoded per capability under capabilities.yaml"
  pack_recommendations: "encoded per capability under capabilities.yaml"
  consumer_ratchets: "supported by workflow.gate_overrides in the engine"
install:
  templates:
    - source: templates/check-docs.mjs
      target: .gc/gate-packs/docs-generic/check-docs.mjs
    - source: templates/vale.ini
      target: .gc/gate-packs/docs-generic/vale.ini
    - source: templates/pre-commit-config.yaml
      target: .gc/gate-packs/docs-generic/pre-commit-config.yaml
  dev_dependencies: []
selftest:
  runner: selftest/run.mjs
  required_tools:
    - node
signing:
  checksum_algorithm: sha256
  provenance: "TODO: signed release provenance before broad rollout"
