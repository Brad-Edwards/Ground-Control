schema_version: 1
pack: python
version: 1.0.0
bindings:
  format:
    status: provided
    provider: ruff-format
    command: ".gc/gate-packs/python/gc-python-run ruff format --check ."
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  lint:
    status: provided
    provider: ruff-check
    command: ".gc/gate-packs/python/gc-python-run ruff check ."
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: ruff_errors
        max: 0
      recommendation:
        metric: ruff_errors
        max: 0
  build:
    status: provided
    provider: python-build
    command: ".gc/gate-packs/python/gc-python-run python -m build"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - pyproject.toml
        - setup.cfg
        - setup.py
        - "**/*.py"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  type_safety:
    status: provided
    provider: pyright-or-mypy
    command: ".gc/gate-packs/python/gc-python-run pyright-or-mypy"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: type_errors
        max: 0
      recommendation:
        metric: type_errors
        max: 0
  unit_tests:
    status: provided
    provider: pytest
    command: ".gc/gate-packs/python/gc-python-run pytest"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - "tests/**"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1200
  integration_tests:
    status: provided
    provider: pytest-integration
    command: ".gc/gate-packs/python/gc-python-run pytest -m integration"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - "tests/**"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1800
  contract_boundary:
    status: provider_missing
    provider_missing: reviewer_fallback
    blocking: false
    reason: "Python boundary contracts depend on the project's Pydantic/icontract/deal/runtime-guard choices."
    thresholds:
      platform_minimum:
        metric: provider_declared
        policy: reviewer_fallback
      recommendation:
        metric: provider_declared
        policy: deterministic_provider_when_adopted
  property_verification:
    status: provided
    provider: hypothesis
    command: ".gc/gate-packs/python/gc-python-run pytest -m fuzz"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - "tests/**"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1800
  architecture:
    status: provided
    provider: import-linter
    command: ".gc/gate-packs/python/gc-python-run lint-imports --config .gc/gate-packs/python/importlinter.ini"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  complexity:
    status: provided
    provider: ruff-complexity
    command: ".gc/gate-packs/python/gc-python-run ruff check --select C901 ."
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: mccabe_complexity
        max: 15
      recommendation:
        metric: mccabe_complexity
        max: 10
  mutation:
    status: provided
    provider: mutmut
    command: ".gc/gate-packs/python/gc-python-run mutmut run"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - "tests/**"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: mutation_score
        min: 60
      recommendation:
        metric: mutation_score
        min: 80
    timeout_seconds: 3600
  diff_coverage:
    status: provided
    provider: coverage-diff-cover
    command: ".gc/gate-packs/python/gc-python-run coverage-diff-cover"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - "tests/**"
    thresholds:
      platform_minimum:
        metric: changed_line_coverage
        min: 80
      recommendation:
        metric: changed_line_coverage
        min: 90
  sast:
    status: provided
    provider: bandit
    command: ".gc/gate-packs/python/gc-python-run bandit -r . -ll"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*.py"
        - pyproject.toml
    thresholds:
      platform_minimum:
        metric: sast_severity
        severity: high
      recommendation:
        metric: sast_severity
        severity: medium
  secret_scan:
    status: provided
    provider: gitleaks
    command: "gitleaks detect --source . --no-git --redact --exit-code 1"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - "**/*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  dependency_policy:
    status: provided
    provider: pip-audit-or-uv-audit
    command: "if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then uv audit; else .gc/gate-packs/python/gc-python-run pip-audit; fi"
    blocking: true
    scope: changed
    applies_when:
      paths:
        - pyproject.toml
        - "requirements*.txt"
        - uv.lock
        - poetry.lock
    thresholds:
      platform_minimum:
        metric: vulnerability_severity
        severity: high
      recommendation:
        metric: vulnerability_severity
        severity: medium
  accessibility:
    status: not_applicable
    provider_missing: not_applicable
    blocking: false
    reason: "Python projects do not expose a rendered UI accessibility surface by default."
    thresholds:
      platform_minimum:
        metric: applicability
        policy: not_applicable
      recommendation:
        metric: applicability
        policy: not_applicable
  docs_policy:
    status: provided
    provider: docs-profile
    command: "if command -v vale >/dev/null 2>&1; then vale .; else echo 'vale not installed; docs policy provider unavailable'; exit 1; fi"
    blocking: false
    scope: changed
    applies_when:
      paths:
        - "*.md"
        - "**/*.md"
        - "*.markdown"
        - "**/*.markdown"
        - "docs/**"
        - "architecture/adrs/**"
        - .ground-control.yaml
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
  traceability:
    status: provider_missing
    provider_missing: reviewer_fallback
    blocking: false
    reason: "Ground Control traceability requires a configured project and live server context."
    thresholds:
      platform_minimum:
        metric: provider_declared
        policy: reviewer_fallback
      recommendation:
        metric: provider_declared
        policy: deterministic_provider_when_adopted
  policy:
    status: provided
    provider: repo-policy
    command: "if [ -f noxfile.py ]; then .gc/gate-packs/python/gc-python-run nox -s verify; elif [ -f Makefile ] && grep -q '^policy:' Makefile; then make policy; elif [ -x ./bin/policy ]; then ./bin/policy --skip-pr-body; else .gc/gate-packs/python/gc-python-run pre-commit run --all-files; fi"
    blocking: true
    scope: repo
    applies_when:
      paths:
        - "**/*"
    thresholds:
      platform_minimum:
        metric: exit_code
        max: 0
      recommendation:
        metric: exit_code
        max: 0
    timeout_seconds: 1800
  remote_status:
    status: provided
    provider: required-statuses
    blocking: true
    scope: repo
    required_statuses:
      - ci
    thresholds:
      platform_minimum:
        metric: required_statuses
        policy: all_success
      recommendation:
        metric: required_statuses
        policy: all_success
