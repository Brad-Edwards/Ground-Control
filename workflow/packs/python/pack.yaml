schema_version: 1
id: python
version: 1.0.0
name: "Python gate pack"
description: "Python package gates grounded in aptl and aces-sdl verification graphs."
compatible_engine: ">=1.0.0 <2.0.0"
profiles:
  - id: default
    description: "Python application or package."
  - id: uv
    description: "uv-managed project."
  - id: nox
    description: "nox-owned verification graph."
grounded_local_anchors:
  - "aptl: pytest, pre-commit, Ruff, Hypothesis, Pydantic, icontract"
  - "aces-sdl: nox verification graph through uv"
capabilities_provided:
  - format
  - lint
  - build
  - type_safety
  - unit_tests
  - integration_tests
  - property_verification
  - architecture
  - complexity
  - mutation
  - diff_coverage
  - sast
  - secret_scan
  - dependency_policy
  - docs_policy
  - policy
  - remote_status
capabilities_not_provided:
  provider_missing:
    - contract_boundary
    - traceability
  not_applicable:
    - accessibility
threshold_tiers:
  platform_minimums: "encoded per capability under capabilities.yaml"
  pack_recommendations: "encoded per capability under capabilities.yaml"
  consumer_ratchets: "supported by workflow.gate_overrides in the engine"
install:
  templates:
    - source: templates/pyproject.gc.toml
      target: .gc/gate-packs/python/pyproject.gc.toml
    - source: templates/importlinter.ini
      target: .gc/gate-packs/python/importlinter.ini
  dev_dependencies:
    - ruff
    - pytest
    - pytest-cov
    - hypothesis
    - diff-cover
    - import-linter
    - bandit
    - pip-audit
selftest:
  runner: selftest/run.mjs
  required_tools:
    - python3
    - pytest
signing:
  checksum_algorithm: sha256
  provenance: "TODO: signed release provenance before broad rollout"
