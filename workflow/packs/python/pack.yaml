schema_version: 1
id: python
version: 1.0.0
name: "Python gate pack"
description: "Python package gates grounded in aptl and aces-sdl verification graphs."
compatible_engine: ">=1.0.0 <2.0.0"
profiles:
  - id: default
    description: "Python application or package."
  - id: uv
    description: "uv-managed project."
  - id: nox
    description: "nox-owned verification graph."
grounded_local_anchors:
  - "aptl: pytest, pre-commit, Ruff, Hypothesis, Pydantic, icontract"
  - "aces-sdl: nox verification graph through uv"
capabilities_provided:
  - format
  - lint
  - build
  - type_safety
  - unit_tests
  - integration_tests
  - property_verification
  - architecture
  - complexity
  - mutation
  - diff_coverage
  - sast
  - secret_scan
  - dependency_policy
  - docs_policy
  - policy
  - remote_status
capabilities_not_provided:
  provider_missing:
    - contract_boundary
    - traceability
  not_applicable:
    - accessibility
threshold_tiers:
  platform_minimums: "encoded per capability under capabilities.yaml"
  pack_recommendations: "encoded per capability under capabilities.yaml"
  consumer_ratchets: "supported by workflow.gate_overrides in the engine"
install:
  templates:
    - source: templates/gc-python-run
      target: .gc/gate-packs/python/gc-python-run
      executable: true
    - source: templates/pyproject.gc.toml
      target: .gc/gate-packs/python/pyproject.gc.toml
    - source: templates/importlinter.ini
      target: .gc/gate-packs/python/importlinter.ini
  dev_dependencies:
    - "bandit==1.9.4"
    - "build==1.5.0"
    - "coverage==7.14.1"
    - "diff-cover==10.3.0"
    - "hypothesis==6.155.2"
    - "import-linter==2.11"
    - "mutmut==3.6.0"
    - "mypy==1.20.2"
    - "nox==2026.4.10"
    - "pip-audit==2.10.0"
    - "pre-commit==4.6.0"
    - "pytest==8.4.2"
    - "pytest-cov==7.1.0"
    - "ruff==0.15.16"
runtime:
  python_environment_launcher: .gc/gate-packs/python/gc-python-run
  resolution_order:
    - uv
    - poetry
    - hatch
    - "$VIRTUAL_ENV"
    - .venv
    - venv
    - "generated .venv"
  fallback_tool_dependencies:
    - "bandit==1.9.4"
    - "build==1.5.0"
    - "coverage==7.14.1"
    - "diff-cover==10.3.0"
    - "hypothesis==6.155.2"
    - "import-linter==2.11"
    - "mutmut==3.6.0"
    - "mypy==1.20.2"
    - "nox==2026.4.10"
    - "pip-audit==2.10.0"
    - "pre-commit==4.6.0"
    - "pytest==8.4.2"
    - "pytest-cov==7.1.0"
    - "ruff==0.15.16"
selftest:
  runner: selftest/run.mjs
  required_tools:
    - uv
signing:
  checksum_algorithm: sha256
  provenance: "TODO: signed release provenance before broad rollout"
