schema_version: 1
pack: cpp-cmake
version: 1.0.0
language:
  primary: cpp
  extensions: [".c", ".cc", ".cpp", ".h", ".hpp"]
frameworks:
  - cmake
  - ctest
  - gtest
  - sanitizers
include:
  paths:
    - "**/*.c"
    - "**/*.cc"
    - "**/*.cpp"
    - "**/*.h"
    - "**/*.hpp"
exclude:
  paths:
    - "build/**"
    - "**/generated/**"
  content:
    - '^\+\s*struct\s+\w+\s*\{[^}]*\};\s*$'
    - '^\+\s*enum\s+(class\s+)?\w+\s*\{\s*([A-Z][A-Za-z0-9_]*,?\s*)+\};\s*$'
surfaces:
  - type: security_boundary
    assurance: L1
    detect:
      content: ['\bAuthorize\b', '\bAuth\b', '\bCredential\b', '\btenant\b', '\bpermission\b', '\bStatusOr<', '\bResult<']
    requires:
      contract:
        content: ['\bExpects\s*\(', '\bEnsures\s*\(', '\bassert\s*\(', '\bCHECK\s*\(', '\bStatusOr<', '\bResult<', '\bthrow\s+std::']
      test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\bTEST(_F|_P)?\s*\(', '\bEXPECT_', '\bASSERT_', '\bUnauthorized\b', '\bForbidden\b']
  - type: state_machine
    assurance: L2
    detect:
      content: ['\bCanTransitionTo\b', '\bTransitionTo\b', '\bSetStatus\b', '\bUpdateStatus\b', '\bInvalidTransition\b', '\bState\b']
    requires:
      contract:
        content: ['\bCanTransitionTo\b', '\bAllowedTransitions\b', '\bInvalidTransition\b', '\bExpects\s*\(', '\bCHECK\s*\(']
      test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\bTEST(_F|_P)?\s*\(', '\btransition\b', '\bstate\b', '\bEXPECT_', '\bASSERT_']
      property_test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\brapidcheck\b', '\bRC_GTEST_PROP\b', '\bGENERATE\b', '\bproperty\b']
  - type: dag_graph
    assurance: L2
    detect:
      content: ['\bTopological\b', '\bDetectCycle\b', '\bGraph\b', '\bDFS\b', '\bBFS\b', '\bAncestors\b', '\bDescendants\b', '\bAcyclic\b']
    requires:
      contract:
        content: ['\bAcyclic\b', '\bCycle\b', '\bVisited\b', '\bDepth\b', '\bExpects\s*\(', '\bCHECK\s*\(']
      test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\bTEST(_F|_P)?\s*\(', '\bcycle\b', '\bpath\b', '\bTopological\b', '\bGraph\b']
      property_test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\brapidcheck\b', '\bRC_GTEST_PROP\b', '\bGENERATE\b', '\bproperty\b']
  - type: corruption_prone_mutator
    assurance: L1
    detect:
      content: ['\bInsert\s*\(', '\bRemove\s*\(', '\bDelete\s*\(', '\bUpdate\s*\(', '\bPersist\b', '\bAudit\b', '\bMetadata\b', '\bSerialize\b']
    requires:
      contract:
        content: ['\bExpects\s*\(', '\bEnsures\s*\(', '\bassert\s*\(', '\bCHECK\s*\(', '\bStatusOr<', '\bResult<', '\binvariant\b']
      test:
        path: ["**/*test*.cc", "**/*test*.cpp", "**/tests/**"]
        content: ['\bTEST(_F|_P)?\s*\(', '\b(Insert|Remove|Delete|Update|Metadata|Audit)\b', '\bEXPECT_', '\bASSERT_']
