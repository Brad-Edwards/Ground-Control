schema_version: 1
id: cpp-cmake
version: 1.0.0
name: "C/C++ CMake gate pack"
description: "C and C++ CMake gates grounded in kuzu's CMake, CTest, clang-tidy, sanitizer, WERROR, and coverage workflows."
compatible_engine: ">=1.0.0 <2.0.0"
profiles:
  - id: default
    description: "CMake project with CTest."
  - id: werror
    description: "Warnings-as-errors build profile."
grounded_local_anchors:
  - "kuzu: Makefile frontend to CMake, CTest, clang-tidy, sanitizer switches, ENABLE_WERROR, LCOV targets"
capabilities_provided:
  - format
  - lint
  - build
  - type_safety
  - unit_tests
  - integration_tests
  - property_verification
  - architecture
  - complexity
  - mutation
  - diff_coverage
  - sast
  - secret_scan
  - dependency_policy
  - docs_policy
  - policy
  - remote_status
capabilities_not_provided:
  provider_missing:
    - contract_boundary
    - traceability
  not_applicable:
    - accessibility
threshold_tiers:
  platform_minimums: "encoded per capability under capabilities.yaml"
  pack_recommendations: "encoded per capability under capabilities.yaml"
  consumer_ratchets: "supported by workflow.gate_overrides in the engine"
install:
  templates:
    - source: templates/clang-tidy
      target: .gc/gate-packs/cpp-cmake/clang-tidy
    - source: templates/clang-format
      target: .gc/gate-packs/cpp-cmake/clang-format
    - source: templates/gc-quality.cmake
      target: .gc/gate-packs/cpp-cmake/gc-quality.cmake
  dev_dependencies: []
selftest:
  runner: selftest/run.mjs
  required_tools:
    - cmake
    - ctest
    - c++
signing:
  checksum_algorithm: sha256
  provenance: "TODO: signed release provenance before broad rollout"
