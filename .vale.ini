StylesPath = .vale/styles
MinAlertLevel = error
Packages = Google

[*.md]
BasedOnStyles = Google, GoogleProject

# Requirement specs (docs/requirements, ADR-093) ARE linted — they are the authored spec record —
# but with the em-dash rules relaxed. Like the skills' own writing-style contract (ADR-055), formal
# requirement prose uses em-dashes to carry content, so the spacing/density/adverb-hyphen rules do not
# apply here. Every other Google/GoogleProject rule still walks these files.
[docs/requirements/*/requirement.md]
BasedOnStyles = Google, GoogleProject
# Dashes: formal requirement prose uses em-dashes to carry content (ADR-055 precedent for the skills).
Google.EmDash = NO
Google.LyHyphens = NO
GoogleProject.EmDashDensity = NO
# Technical-spec false positives that Google's marketing-doc rules raise on requirement prose:
# dotted type/enum identifiers (AssetType.THIRD_PARTY) trip Spacing; quoted example strings trip the
# American-punctuation Quotes rule; "data steward" trips GenderBias; an example duration ("2h") trips
# Units. Substantive rules (spelling, Latin abbreviations, plurals, weasel words, etc.) still walk.
Google.Spacing = NO
Google.Quotes = NO
Google.GenderBias = NO
Google.Units = NO

# Ported research workflow skill prose (ADR-055): the skills carry their
# own writing-style contract (see skills/lit-review-draft/writing-style.md,
# Part A7 — em-dashes carry content) and are not external-facing docs.
[skills/**]
BasedOnStyles =

# Historical knowledge-base ports — verbatim record value outweighs
# enforcing Google style on ingested research material.
[docs/knowledge/**]
BasedOnStyles =

# CHANGELOG.md is generated and owned by Release Please (GC-P027 / #1399): its
# content is collated release notes and Conventional-Commit-derived entries, not
# authored prose, so Google-style enforcement is inappropriate (same rationale as
# the knowledge-base ports above).
[CHANGELOG.md]
BasedOnStyles =
