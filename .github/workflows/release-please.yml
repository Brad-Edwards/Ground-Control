name: Release Please

# Release Please (issue #1399, ADR-063 "2026-07-15 Amendment", GC-P027) owns product
# versioning, CHANGELOG.md, the annotated vX.Y.Z tag, and the GitHub Release. On each
# push to `main` it maintains a release PR ("chore(main): release X.Y.Z") that bumps the
# product-version mirrors (backend/build.gradle.kts, frontend/package.json + lockfile via
# release-please-config.json extra-files) and regenerates CHANGELOG.md from the
# Conventional Commit history. Merging that PR tags vX.Y.Z and cuts the GitHub Release;
# the publish job then builds the versioned GHCR image and records the exact digest +
# source commit in the release (ADR-063 §2 immutable artifact identity).
#
# Publication lives IN this run and is gated on `release_created`: a tag/release created
# with GITHUB_TOKEN does NOT trigger a second workflow (GitHub recursion rule), so the
# tag path of ci.yml is not a reliable continuation. The full CI gate graph
# (build/test/integration/sonar/verify/mcp-contract/docker/smoke) runs on the release PR
# before a human merges it; this workflow adds only the versioned artifact publication.
#
# The release PR is opened by GITHUB_TOKEN, so `dev`'s required checks do not auto-run on
# it — admin/one-click merge it. The main -> dev back-merge is handled by
# sync-main-to-dev.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/maintain the release PR, tag, and Release
      pull-requests: write # maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
      patch: ${{ steps.rp.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # append the artifact identity to the GitHub Release
      packages: write # push the versioned image to GHCR
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ground_control
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the immutable versioned coordinates X.Y.Z and X.Y. The version
      # comes from Release Please outputs (not a re-parsed tag); docker/metadata-action's
      # {{version}} convention publishes the leading-v-stripped image tag (ADR-063 §2).
      # :main / :latest / sha-* stay branch coordinates owned by ci.yml and are never a
      # release coordinate.
      - id: build
        name: Build and push the versioned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/autarchy-ai/ground-control:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
            ghcr.io/autarchy-ai/ground-control:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke the EXACT published digest (not the concurrent ci.yml branch build) so the
      # artifact we record is proven to start, migrate, and report healthy.
      - name: Smoke the published image (Flyway + health)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "${IMAGE_DIGEST:-}" in
            sha256:*) ;;
            *) echo "::error::build produced no sha256 digest; refusing to smoke/publish."; exit 1 ;;
          esac
          ref="ghcr.io/autarchy-ai/ground-control@${IMAGE_DIGEST}"
          docker run -d --name gc-release-smoke \
            --network host \
            -e GC_DATABASE_URL=jdbc:postgresql://localhost:5432/ground_control \
            -e GC_DATABASE_USER=gc \
            -e GC_DATABASE_PASSWORD=gc \
            "${ref}"
          echo "Waiting for application startup..."
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/actuator/health >/dev/null 2>&1; then
              echo "Release smoke passed for ${ref}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Release smoke failed after 120s for ${ref}"
          docker logs gc-release-smoke || true
          exit 1

      # Record the immutable artifact identity in the Release Please-created GitHub
      # Release. Idempotent and write-once: reruns repair a release that has no artifact
      # block, no-op when the same digest is already recorded, and fail closed rather than
      # repoint a release to a different digest.
      - name: Record the release artifact identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${IMAGE_DIGEST:-}" in sha256:*) ;; *) echo "::error::missing digest"; exit 1 ;; esac
          case "${VERSION}" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::bad version '${VERSION}'"; exit 1 ;; esac
          case "${SOURCE_SHA}" in ????????????????????????????????????????) ;; *) echo "::error::bad source sha"; exit 1 ;; esac
          existing="$(gh release view "${TAG}" --json body --jq '.body' 2>/dev/null || echo '')"
          if printf '%s' "${existing}" | grep -q 'Release artifact'; then
            if printf '%s' "${existing}" | grep -qF "ground-control@${IMAGE_DIGEST}"; then
              echo "Release ${TAG} already records digest ${IMAGE_DIGEST}; nothing to do."
              exit 0
            fi
            echo "::error::${TAG} already records a different artifact digest; refusing to repoint a write-once release coordinate."
            exit 1
          fi
          {
            printf '%s\n' "${existing}"
            printf '\n---\n\n**Release artifact**\n\n'
            printf -- '- Image: `ghcr.io/autarchy-ai/ground-control:%s`\n' "${VERSION}"
            printf -- '- Digest: `ghcr.io/autarchy-ai/ground-control@%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Source commit: `%s`\n' "${SOURCE_SHA}"
          } > release-notes.md
          gh release edit "${TAG}" --notes-file release-notes.md
