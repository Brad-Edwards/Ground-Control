name: Workflow Platform

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "skills/**"
      - "mcp/**"
      - "workflow/**"
      - ".github/workflows/workflow-platform.yml"
  push:
    branches: [main, dev]
    paths:
      - "skills/**"
      - "mcp/**"
      - "workflow/**"
      - ".github/workflows/workflow-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install MCP dependencies
        run: npm --prefix mcp/ground-control ci
      - name: Build engine and gate-pack release artifacts
        run: node workflow/tools/materialize-pack-registry.mjs
      - name: Validate release catalog and checksums
        run: node workflow/tools/verify-workflow-release.mjs
      - name: Run workflow engine eval suite
        run: node workflow/tools/eval-workflow-engine.mjs
      - name: Upload workflow release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-release-artifacts
          path: |
            workflow/releases/*.tgz
            workflow/gate-catalog.json

  pack-selftests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: rust-cargo
            toolchain: rust-cargo
            allow_skip: "false"
          - pack: python
            toolchain: python-pytest
            allow_skip: "false"
          - pack: jvm-gradle
            toolchain: gradle-jdk21
            allow_skip: "false"
          - pack: jvm-maven
            toolchain: maven-jdk21
            allow_skip: "false"
          - pack: node-ts
            toolchain: node-npm
            allow_skip: "false"
          - pack: cpp-cmake
            toolchain: cpp-cmake
            allow_skip: "false"
          - pack: docs-generic
            toolchain: node
            allow_skip: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install MCP dependencies
        run: npm --prefix mcp/ground-control ci
      - name: Set up Java 21
        if: matrix.toolchain == 'gradle-jdk21' || matrix.toolchain == 'maven-jdk21'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        if: matrix.toolchain == 'gradle-jdk21'
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          gradle-version: "8.14.3"
      - name: Install pack toolchain
        run: |
          set -euo pipefail
          case "${{ matrix.toolchain }}" in
            rust-cargo)
              if ! command -v cargo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y cargo
              fi
              ;;
            python-pytest)
              python3 -m pip install --user pytest
              ;;
            maven-jdk21)
              sudo apt-get update
              sudo apt-get install -y maven
              ;;
            cpp-cmake)
              sudo apt-get update
              sudo apt-get install -y cmake g++
              ;;
            node|node-npm|gradle-jdk21)
              true
              ;;
            *)
              echo "::error::Unknown toolchain '${{ matrix.toolchain }}'"
              exit 1
              ;;
          esac
      - name: Build release catalog for self-test install
        run: node workflow/tools/materialize-pack-registry.mjs
      - name: Run pack self-test
        env:
          PACK_ID: ${{ matrix.pack }}
          ALLOW_SKIP: ${{ matrix.allow_skip }}
        run: |
          set -euo pipefail
          RESULT="$(node workflow/tools/selftest-pack.mjs --pack "${PACK_ID}" --catalog workflow/gate-catalog.json)"
          echo "${RESULT}"
          node - "${RESULT}" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          if (result.ok !== true) {
            console.error(`pack self-test failed for ${result.pack}: ${JSON.stringify(result)}`);
            process.exit(1);
          }
          if (result.status === "skipped") {
            const missing = (result.missing_tools || []).join(", ");
            console.log(`::warning::${result.pack} self-test skipped; requires toolchain image/tools: ${missing || result.reason}`);
            if (process.env.ALLOW_SKIP !== "true") {
              console.error(`${result.pack} was expected to run in this matrix entry, not skip.`);
              process.exit(1);
            }
          }
          NODE
