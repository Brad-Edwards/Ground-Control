name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Fast-feedback lane (issue #1461, ADR-091). Formatting and compilation are
  # the two most common breakages; this reports them before any full lane
  # finishes. `-Pquick` drops Error Prone, Checkstyle, and SpotBugs, all of
  # which the `build` and `test` gates still run in full.
  #
  # Deliberately NOT a required context. A second required gate covering a
  # subset of an existing gate is a shadow merge authority; the complete suite
  # stays the single authority. `tools/tests/test_ci_topology.py` enforces both
  # halves of that: the lane exists, and it is not in the required set.
  # ---------------------------------------------------------------------------
  fast-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Format and compile
        run: cd backend && ./gradlew spotlessCheck compileJava compileTestJava -Pquick --no-daemon

  # ---------------------------------------------------------------------------
  # Frontend verification (issue #1468, ADR-091). Until this lane existed
  # `frontend/` was only compiled indirectly by the Docker image build, which
  # runs after merge and runs neither lint nor tests, so nothing gated a
  # frontend regression. Node 22 matches the `node:22-alpine` frontend stage in
  # backend/Dockerfile.
  #
  # The job id is the required context name: no `name:` override and no matrix,
  # because a matrix would report `frontend (node-22)` and branch protection
  # would wait forever on a context that never arrives.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    # This lane installs PR-controlled dependencies and executes npm lifecycle
    # scripts, so it must not inherit the workflow-level packages/PR/OIDC write
    # grants. tools/tests/test_ci_topology.py asserts this stays read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Unit tests
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Fetch PR comments for policy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | {body: .body, author: .user.login}' \
            > "$RUNNER_TEMP/gc-pr-comments.jsonl"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Show Python version
        run: python3 --version
      - name: Install pre-commit
        run: |
          python3 -m pip install --user pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Hook environments (including the gitleaks binary) are rebuilt on every
      # run without this, which is most of the hygiene step's wall time. The key
      # is the hook-config hash, so a pinning change always misses the cache and
      # a hit can never serve a hook version other than the pinned one.
      - name: Cache pre-commit hook environments
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit file hygiene and secret scan
        run: |
          for hook in \
            trailing-whitespace \
            end-of-file-fixer \
            check-yaml \
            check-json \
            check-added-large-files \
            check-merge-conflict \
            detect-private-key \
            gitleaks
          do
            pre-commit run "$hook" --all-files
          done
      # Policy tests include a renderer-vs-check_pr_body compose check
      # (`test_gc_render_pr_body_*_output_passes_check_pr_body`) that spawns
      # `node tools/render_pr_body_fixture.mjs`, which imports the MCP
      # server's `mcp/ground-control/lib.js`. The fixture therefore needs the
      # MCP server's node_modules (js-yaml, zod, @modelcontextprotocol/sdk)
      # available — install them before running policy tests so the compose
      # check binds the actual JS renderer against the Python policy. Per
      # ADR-036 (issue #868 cycle-1 F3): the compose test must invoke the
      # real renderer rather than a copied Markdown fixture.
      - name: Install MCP server deps (for renderer compose check)
        run: npm --prefix mcp/ground-control ci
      - name: Policy tool tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: MCP server tests
        run: npm --prefix mcp/ground-control test
      - name: Repo policy checks
        if: github.event_name == 'pull_request'
        run: >
          python3 bin/policy
          --base "origin/${{ github.base_ref }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --event-path "$GITHUB_EVENT_PATH"
          --pr-comments-json "$RUNNER_TEMP/gc-pr-comments.jsonl"
      - name: Repo policy checks (push)
        if: github.event_name != 'pull_request'
        run: python3 bin/policy --skip-pr-body
      # Vale prose linting (ADR-054). Lints only docs touched in this PR's diff
      # — untouched docs migrate organically per #896. Skipped on push events
      # because there's no base ref to diff against; the on-PR pass is the
      # authoritative gate (a doc only reaches main via a PR).
      - name: Vale prose lint (changed docs)
        if: github.event_name == 'pull_request'
        run: make vale-lint BASE_REF=origin/${{ github.base_ref }}

  policy-live:
    # Deliberate exception to the github-hosted default. `vars.GC_BASE_URL`
    # is expected to point at the tailnet-only Ground Control instance on
    # red-dragon (per ADR-030); github-hosted runners can't reach it. If
    # `GC_BASE_URL` is later pointed at a public-reachable instance, this
    # can move to ubuntu-latest. Currently the var is unset so this job
    # is skipped on every PR, but the runner choice has to match the
    # intended target, not the empty-default behavior.
    runs-on: [self-hosted, linux, x64]
    needs: [policy]
    # The live token may NEVER run against attacker-controlled refs. `main` is
    # the only branch with merge protection, so restrict execution to it on
    # both `push` and `workflow_dispatch`. PR runs, dev/tag pushes, and
    # workflow_dispatch on a feature branch all otherwise expose
    # `secrets.GROUND_CONTROL_API_TOKEN` to checked-out JS that the attacker
    # could rewrite to exfiltrate the bearer token (#828 cycle 3 security
    # finding). Cancel-in-progress is governed by the workflow-level concurrency
    # block; this guard is purely about which refs may see the secret.
    if: vars.GC_BASE_URL != '' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install MCP helper dependencies
        run: npm --prefix mcp/ground-control ci
      - name: Live Ground Control ADR drift check
        env:
          # ADR-026 / GC-P011: the live instance enforces bearer auth, so the
          # MCP client below needs GROUND_CONTROL_API_TOKEN exposed (it falls
          # back to GROUND_CONTROL_PACK_REGISTRY_ADMIN_TOKEN for legacy
          # pack-registry calls). Without this passthrough the job 401s every
          # request — exactly the failure mode #828 was filed against.
          GC_BASE_URL: ${{ vars.GC_BASE_URL }}
          GROUND_CONTROL_API_TOKEN: ${{ secrets.GROUND_CONTROL_API_TOKEN }}
        run: node tools/ground_control/check_adr_drift.mjs
      - name: Live Ground Control policy check
        env:
          GC_BASE_URL: ${{ vars.GC_BASE_URL }}
          GROUND_CONTROL_API_TOKEN: ${{ secrets.GROUND_CONTROL_API_TOKEN }}
        run: node tools/ground_control/check_live_policy.mjs

  # ---------------------------------------------------------------------------
  # Advisory security scanners — Trivy (image + IaC) and OSV-scanner (Java
  # deps). Both are non-blocking: findings produce SARIF artifacts but never
  # fail CI or gate `docker`/`smoke`. Scope and guardrails are
  # captured in `architecture/notes/security-scanner-ci-preflight.md`.
  # Gitleaks (pre-commit) and SonarCloud remain the authoritative controls
  # for secrets and code quality respectively; these jobs are additive.
  # ---------------------------------------------------------------------------
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Every image pull in this job is an ANONYMOUS Docker Hub request: buildx
      # bootstraps `moby/buildkit:buildx-stable-1` under the default
      # docker-container driver, and backend/Dockerfile pulls `node` and
      # `eclipse-temurin`. Anonymous pulls from shared GitHub runner egress are
      # rate-limited and deprioritized, so a single
      # `Get "https://registry-1.docker.io/v2/": context deadline exceeded`
      # turned this REQUIRED merge check red with no security signal behind it.
      # Retry the registry-dependent steps once instead of failing the gate on a
      # transient registry hiccup. Authenticated pulls or a registry mirror are
      # the durable removal of this dependency; both need credentials/infra that
      # are not decided here.
      - id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Retry buildx setup (transient registry failure)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      # Build the backend image locally for image-vuln scanning. Reuses
      # backend/Dockerfile per the preflight constraint ("do not invent a
      # scanner-specific Docker build path"). Not pushed; tag only exists
      # inside this job.
      - id: build_image
        name: Build image for scanning
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: gc-trivy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry image build (transient registry failure)
        if: steps.build_image.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: gc-trivy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: gc-trivy:ci
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN

      - name: Trivy IaC scan (deploy/docker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/docker/
          format: sarif
          output: trivy-deploy-docker.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN

      - name: Upload Trivy SARIF artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: |
            trivy-image.sarif
            trivy-deploy-docker.sarif

      # The scans above report (exit-code 0, every severity) so the SARIF stays
      # complete. THIS step is what makes `trivy` a real merge gate. Without it
      # the required check could only ever fail on infrastructure, never on a
      # vulnerability — it blocked merges on registry hiccups while providing no
      # blocking security signal. That inversion is why a CRITICAL Spring
      # Security authorization bypass (CVE-2026-22732, CVE-2025-41232) shipped
      # unnoticed.
      #
      # Scoped to CRITICAL/HIGH with a known fix: an unfixed upstream CVE has no
      # remediation path, so gating on it would block every merge without
      # offering an action. Misconfig findings stay report-only in the SARIF
      # above; vulnerabilities and secrets block. Findings are fixed by upgrading
      # the dependency, never by a .trivyignore suppression.
      - name: Trivy gate (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: gc-trivy:ci
          scanners: vuln,secret
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4

      # Verify (don't regenerate) the committed lockfile. With strict
      # dependency locking enabled in build.gradle.kts, `gradle dependencies`
      # resolves every configuration and fails if the resolved graph
      # diverges from the committed lockfile. We also `git diff --exit-code`
      # as a belt-and-suspenders guard against any silent rewrite —
      # `--write-locks` is intentionally NOT passed so the committed
      # lockfile is what OSV-scanner ends up scanning.
      - name: Verify Gradle dependency lock state matches committed lockfile
        run: |
          cd backend && ./gradlew dependencies --no-daemon
          cd "${GITHUB_WORKSPACE}"
          git diff --exit-code -- backend/gradle.lockfile

      # `continue-on-error: true` is needed because osv-scanner exits non-zero
      # when it finds vulnerabilities (exit 1) — that's the advisory case we
      # want to suppress. But blanket suppression also masks real scanner
      # failures (exit 127 = no input, exit 128 = parser error, etc.), which
      # would silently produce no SARIF and still report success. The
      # follow-up "Validate OSV-scanner output" step asserts the SARIF file
      # exists and is well-formed, so genuine tool failures fail the job
      # while findings stay advisory.
      - name: Run OSV-scanner against backend/gradle.lockfile
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        with:
          scan-args: |-
            --lockfile=backend/gradle.lockfile
            --format=sarif
            --output=osv-scanner.sarif
        continue-on-error: true

      - name: Validate OSV-scanner output
        run: |
          set -euo pipefail
          if [ ! -s osv-scanner.sarif ]; then
            echo "::error::OSV-scanner produced no SARIF output — treating as scanner failure (not a findings-only outcome)"
            exit 1
          fi
          # SARIF v2 documents include a "$schema" or "version" key at the
          # root. A truncated or empty-shell file would have neither.
          if ! grep -q -E '"version"|\$schema' osv-scanner.sarif; then
            echo "::error::OSV-scanner SARIF is malformed (no version/schema key found)"
            cat osv-scanner.sarif | head -20 >&2 || true
            exit 1
          fi
          echo "OSV-scanner SARIF emitted at osv-scanner.sarif (advisory baseline; the gate step below fails on CRITICAL CVEs)"

      # CRITICAL CVE gate (#931). Parses the SARIF that the advisory step
      # produced and fails the job if any rule has severity CRITICAL. OSV
      # encodes severity in two places per rule: `properties.severity` (CVSS
      # category) and a `level` (note/warning/error). We match either
      # CRITICAL-flagged property or `level=error` so the gate catches both
      # cases. Building on the existing job (per #931 preflight) instead of
      # adding a new scanner lane keeps secret-scope/permissions surface flat.
      - name: Gate on CRITICAL CVEs
        run: |
          set -euo pipefail
          # Best-effort jq install (Ubuntu runners ship with jq pre-installed,
          # but we don't rely on it).
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          # Count CRITICAL rules / results. The SARIF "level=error" mapping
          # is OSV-scanner's signal for CRITICAL; we also look for the
          # canonical CVSS severity field as a belt-and-suspenders check.
          critical=$(jq '[
            .runs[]?.results[]?
            | select((.level == "error") or ((.properties?.severity // "") | ascii_upcase == "CRITICAL"))
          ] | length' osv-scanner.sarif)
          if [ "$critical" -gt 0 ]; then
            echo "::error::OSV-scanner flagged $critical CRITICAL CVE(s). Update the affected dependency or pin to a patched version."
            jq '[
              .runs[]?.results[]?
              | select((.level == "error") or ((.properties?.severity // "") | ascii_upcase == "CRITICAL"))
              | { ruleId, message: (.message.text // ""), level }
            ]' osv-scanner.sarif >&2 || true
            exit 1
          fi
          echo "OSV-scanner: no CRITICAL CVEs."

      - name: Upload OSV-scanner SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-scanner-sarif
          path: osv-scanner.sarif
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Backend verification. Every lane below starts at t=0 (issue #1461,
  # ADR-091): none of them downloads an artifact from another, each rebuilds
  # from a fresh checkout, so a `needs` edge between them is pure serialization.
  # `tools/tests/test_ci_topology.py` fails if one is reintroduced.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Build
        run: cd backend && ./gradlew build -x test --no-daemon
      - name: Check formatting
        run: cd backend && ./gradlew spotlessCheck --no-daemon

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Run unit tests
        run: cd backend && ./gradlew check --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: backend/build/reports/tests/test/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Run integration tests
        run: cd backend && ./gradlew integrationTest --no-daemon
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-report
          path: backend/build/reports/tests/integrationTest/

  # ---------------------------------------------------------------------------
  # SonarCloud — generates its own coverage, fails CI if the quality gate is red
  # ---------------------------------------------------------------------------
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Cache SonarCloud packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Sonar reads exactly two things, both declared in backend/build.gradle.kts:
      # sonar.java.binaries=build/classes and
      # sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml.
      # No SpotBugs or Checkstyle report path is wired into the Sonar properties,
      # so `./gradlew build sonar` spent the critical path assembling the boot jar
      # and re-running static analysis that the `build` and `test` gates already
      # own. Two invocations rather than one: `sonar` has no ordering relation to
      # the `finalizedBy` JaCoCo report, and analyzing before the report is
      # written would silently report zero coverage.
      - name: Generate coverage
        run: cd backend && ./gradlew test jacocoTestReport --no-daemon
      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: cd backend && ./gradlew sonar -Dsonar.qualitygate.wait=true --no-daemon
      - name: Fail on new SonarCloud issues
        if: github.ref_type != 'tag'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 tools/sonar/assert_no_new_issues.py --project-key autarchy-ai_Ground-Control

  # ---------------------------------------------------------------------------
  # Verification — OpenJML extended static checking over sources
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: OpenJML Extended Static Checking
        run: cd backend && ./gradlew openjmlEsc --no-daemon

  # ---------------------------------------------------------------------------
  # MCP–backend write-contract drift gate (issue #1106, ADR-034).
  # Generates the Springdoc OpenAPI spec via Testcontainers, then runs the
  # Node contract test that compares MCP write-tool allowlists against the spec.
  # Runs independently and blocks docker.
  # ---------------------------------------------------------------------------
  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '20'
      - name: Install MCP dependencies
        run: npm --prefix mcp/ground-control ci
      - name: Regenerate committed contract artifacts
        run: make contracts
      - name: Assert generated contract artifacts are committed
        run: git diff --exit-code contracts/ frontend/src/types/api.ts
      - name: Check OpenAPI breaking changes
        env:
          BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: node tools/contracts/check-breaking-changes.mjs
      - name: Run MCP contract test
        run: GC_OPENAPI_SPEC=contracts/openapi/openapi.json node --test mcp/ground-control/openapi-contract.test.js

  # ---------------------------------------------------------------------------
  # Docker — publishes only behind every verification gate. This list is
  # exhaustive by necessity (issue #1461): the flat graph above has no
  # transitive gating left to inherit, so an omission here silently lets an
  # image ship past a red check. `trivy` and `osv-scanner` were never in the
  # old transitive closure, which meant an image could be published while a
  # security scan was red. `tools/tests/test_ci_topology.py` derives the
  # expected list from the workflow's own job set, so a new lane must be gated
  # here or explicitly excused in DOCKER_GATE_EXCLUSIONS. `policy-live` is
  # excluded because GitHub skips a job whose `needs` entry was skipped, and it
  # is skipped on every ref but `main`.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs:
      [
        policy,
        build,
        test,
        integration,
        verify,
        sonar,
        mcp-contract,
        trivy,
        osv-scanner,
        frontend,
      ]
    # Branch build coordinates only (:main / :dev / :sha / :latest). Versioned release
    # images (X.Y.Z + digest) are published by release-please.yml on release_created; a
    # GITHUB_TOKEN-created release tag would not retrigger this workflow anyway (GC-P027).
    if: |
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: |
            ghcr.io/autarchy-ai/ground-control
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Smoke test — validates Docker image starts, Flyway migrates, health is UP
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    needs: [docker]
    if: needs.docker.result == 'success'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ground_control
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -t gc-smoke -f backend/Dockerfile .

      - name: Run image and verify Flyway + health
        run: |
          docker run -d --name gc-smoke \
            --network host \
            -e GC_DATABASE_URL=jdbc:postgresql://localhost:5432/ground_control \
            -e GC_DATABASE_USER=gc \
            -e GC_DATABASE_PASSWORD=gc \
            gc-smoke

          echo "Waiting for application startup..."
          for i in $(seq 1 60); do
            HEALTH=$(curl -sf http://localhost:8000/actuator/health 2>/dev/null) && {
              echo "Smoke test passed: $HEALTH"
              exit 0
            }
            sleep 2
          done

          echo "Smoke test failed after 120s"
          docker logs gc-smoke
          exit 1

  # ---------------------------------------------------------------------------
  # Deploy — temporarily removed. The push-to-main → ssh `gc-deploy@red-dragon`
  # → forced-command `/opt/gc/deploy.sh` flow (per ADR-030) is currently
  # operator-driven only: run `make deploy` from any tailnet host (or on
  # red-dragon itself). The CI deploy job will be reinstated once the
  # auto-deploy ergonomics are revisited; the `RED_DRAGON_DEPLOY_KEY` /
  # `RED_DRAGON_KNOWN_HOSTS` secrets and `environment: dev` registration
  # remain in place against that return. See `skills/deploy/SKILL.md` and
  # `docs/deployment/DEPLOYMENT.md` for the manual flow.
  # ---------------------------------------------------------------------------
